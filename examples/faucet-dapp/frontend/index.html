<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>X1 Faucet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    button { padding: 0.7rem 1.2rem; margin: 0.25rem 0; border: 1px solid #1a1a1a; background: #fff; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:hover:not(:disabled) { background: #f2f2f2; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .stat { font-size: 1.6rem; font-weight: 600; margin: 0.25rem 0; }
    .label { color: #666; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .card { border: 1px solid #e2e2e2; border-radius: 10px; padding: 1.2rem; margin: 1rem 0; }
    #log { white-space: pre-wrap; background: #f6f6f6; padding: 1rem; border-radius: 6px; margin-top: 1rem; font-size: 0.85rem; }
    code { background: #f2f2f2; padding: 0.1rem 0.3rem; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>X1 Faucet</h1>
  <p>
    A self-serve faucet for the <code>X1F</code> test token — claim tokens straight from your
    browser instead of the Discord bot. Built with <strong>X1 Forge</strong> as a reference dApp
    for the X1 EcoChain Maculatus testnet.
  </p>

  <button id="connectBtn">Connect Wallet</button>
  <button id="addNetworkBtn">Add X1 EcoChain to MetaMask</button>
  <p>Account: <span id="account">not connected</span></p>

  <div class="card">
    <div class="label">Your balance</div>
    <div class="stat"><span id="balance">–</span> X1F</div>
  </div>

  <div class="card">
    <div class="label">Next claim</div>
    <div class="stat" id="cooldownStatus">connect wallet to check</div>
    <button id="claimBtn" disabled>Claim 50 X1F</button>
  </div>

  <div id="log"></div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
