<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>X1 App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    button { padding: 0.6rem 1rem; margin: 0.25rem 0; border: 1px solid #1a1a1a; background: #fff; border-radius: 6px; cursor: pointer; }
    button:hover { background: #f2f2f2; }
    input { padding: 0.5rem; width: 100%; box-sizing: border-box; margin: 0.4rem 0; }
    #log { white-space: pre-wrap; background: #f6f6f6; padding: 1rem; border-radius: 6px; margin-top: 1rem; font-size: 0.85rem; }
    code { background: #f2f2f2; padding: 0.1rem 0.3rem; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>X1 App</h1>
  <p>Starter dApp scaffolded with <strong>create-x1-app</strong> — talking to the X1 EcoChain Maculatus testnet (chain ID 10778).</p>

  <button id="connectBtn">Connect Wallet</button>
  <button id="addNetworkBtn">Add X1 EcoChain to MetaMask</button>
  <p>Account: <span id="account">not connected</span></p>

  <h3>Greeter contract</h3>
  <p>Deploy the sample contract first (<code>npm run deploy:testnet</code>), then paste its address below.</p>
  <input id="contractAddress" placeholder="0x... deployed Greeter address" />
  <button id="readBtn">Read greeting</button>
  <input id="newGreeting" placeholder="New greeting" />
  <button id="writeBtn">Set greeting</button>

  <div id="log"></div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
